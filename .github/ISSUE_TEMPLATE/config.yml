blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/jbouder/holotable/security/advisories/new
    about: >
      Please do not open a public issue for a security report. Use GitHub's
      private vulnerability reporting — see SECURITY.md for the trust model and
      response targets.
  - name: Code of Conduct report
    url: https://github.com/jbouder/holotable/security/advisories/new
    about: >
      Conduct reports go through the same private channel. Title it "Code of
      Conduct report" so it is routed correctly.
  - name: Documentation
    url: https://github.com/jbouder/holotable/tree/main/docs
    about: >
      Architecture, invariants, Keycloak setup, and the configuration
      reference — check here before filing a question as a bug.
