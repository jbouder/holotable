# Dependabot version updates (#164).
#
# Every runtime dependency is pinned exactly and every base image by digest,
# which is right for reproducibility and also means nothing moves unless
# something proposes it. This file is that something. Each entry is reviewed
# and merged by a person like any other pull request: nothing here
# auto-merges, and CI's required checks (static checks, test, build) gate
# every update the same way they gate a hand-written change.
#
# Minor and patch updates arrive grouped, one pull request per directory per
# month, production and development dependencies together. A major is never in
# a group, so it arrives as its own pull request: a `next` or `react` major is a
# framework migration (see the framework warning in AGENTS.md), not a version
# bump. Each Dockerfile's base images move together.
#
# Security updates are separate from these version updates. GitHub opens them
# as soon as an advisory lands, whatever the schedule, and
# `open-pull-requests-limit` does not hold them back; each npm directory's
# arrive together in its `security` group rather than one package at a time.
#
# Node 25 and later are ignored everywhere (the `node` base images and
# `@types/node`): Holotable tracks Node's long-term-support line, so 24 may be
# proposed but 25 (odd, never LTS) and 26 are not. A Node major is still a
# deliberate change: when 24 arrives, take it in one pull request that moves
# the Dockerfile's two Node bases, the CI `node-version` and `@types/node` together rather
# than merging the per-file bumps. Raise the bound when the next LTS line is
# the one to move to.
#
# TypeScript 7 and later are ignored for the app (not the docs site or the
# demo Worker, which do not build through Next): 7 is the native compiler and
# drops the JavaScript API, so `require("typescript")` no longer returns a
# compiler. Next 16 loads TypeScript that way for `next typegen` and for the
# type-check step of `next build`, and both fail with "you do not have the
# required package(s) installed" (#309). Remove the entry when a Next release
# supports TypeScript 7.
#
# Add any other `ignore` entry only for an update known to break, with a
# comment saying why and what would let it be removed.
version: 2

updates:
  # The app.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Node 25+ is not proposed; see the header.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # TypeScript 7+ breaks Next 16's build and typegen; see the header.
      - dependency-name: typescript
        versions: [">=7"]
      # @grafana/lezer-logql 0.4.x declares an exact peer, `@lezer/lr` 1.4.10,
      # so `npm ci` fails with ERESOLVE beside the 1.4.11 the other grammars
      # share. It is also the LogQL guard's parser, so moving it is a guard
      # change (run the fuzzer). Remove when a release takes `@lezer/lr` as a
      # range again.
      - dependency-name: "@grafana/lezer-logql"
        versions: [">=0.4"]
    open-pull-requests-limit: 5
    commit-message:
      # `chore(deps): …` for dependencies, `chore(deps-dev): …` for
      # devDependencies, matching the Conventional Commits in CONTRIBUTING.md.
      prefix: chore
      include: scope
    groups:
      # Every minor and patch update in this directory, production and
      # development alike, in one pull request a month.
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      # Security updates in this directory together, whenever they land.
      security:
        applies-to: security-updates
        patterns: ["*"]

  # The docs site: its own package.json and lockfile, so without this entry it
  # is never updated.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Every minor and patch update in this directory, production and
      # development alike, in one pull request a month.
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      # Security updates in this directory together, whenever they land.
      security:
        applies-to: security-updates
        patterns: ["*"]

  # The hosted demo's Worker (deploy/cloudflare/demo): its own package.json
  # and lockfile, checked by .github/workflows/demo.yml. Its Dockerfile is a
  # one-line FROM of this repository's own quick-start image, so it has no
  # base image to update.
  - package-ecosystem: npm
    directory: /deploy/cloudflare/demo
    schedule:
      interval: monthly
    ignore:
      # Node 25+ is not proposed; see the header.
      - dependency-name: "@types/node"
        versions: [">=25"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Every minor and patch update in this directory, production and
      # development alike, in one pull request a month.
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      # Security updates in this directory together, whenever they land.
      security:
        applies-to: security-updates
        patterns: ["*"]

  # The repository Dockerfile's digest-pinned bases. Digest pinning (#36) is
  # what makes this necessary: a pinned digest never moves on its own. Three:
  # the Debian Node base, and the quick-start target's Alpine Node base and
  # the TimescaleDB base it runs on (#612 moved them into this file). A
  # TimescaleDB update should move docker-compose.yml and the CI service
  # containers to the same version in the same pull request.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Node 25+ is not proposed; see the header.
      - dependency-name: node
        versions: [">=25"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # A base image moves by digest, which has no semver level; one group
      # takes every update to this Dockerfile's bases together.
      images:
        patterns: ["*"]

  # The actions in .github/workflows/. Each is pinned to a commit SHA with
  # its version in a trailing `# vX.Y.Z` comment (test/workflow-pins.test.ts
  # holds that); Dependabot updates the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        update-types: [minor, patch]

  # The local composite action every Node job starts with (#348). The entry
  # above covers .github/workflows/ only; an action's own `uses:` lines are
  # found by naming its directory. test/workflow-pins.test.ts holds every use
  # of an action to one pin, so an update here and one above must land
  # together.
  - package-ecosystem: github-actions
    directory: /.github/actions/setup
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
