name: Docs

# The docs site is generated partly FROM the app source (the configuration
# reference from src/lib/config.ts, the viz list from src/lib/ir.ts), so a
# change to either must rebuild and redeploy the site.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/lib/config.ts"
      - "src/lib/ir.ts"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/lib/config.ts"
      - "src/lib/ir.ts"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      # `npm run build` runs scripts/generate-reference.mjs first, then Astro.
      # The build fails on a broken internal link (starlight-links-validator)
      # and on a reference page that can no longer be generated from source.
      - name: Build
        working-directory: docs
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    runs-on: ubuntu-latest
    # Forked pull requests have no access to secrets; they stop at `build`.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Build
        working-directory: docs
        run: npm run build

      # `versions upload` (the preview path) requires the Worker to already
      # exist, and the Worker is only created by the first `deploy` on main.
      # Look it up so the first pull request skips the preview instead of
      # failing on that chicken-and-egg.
      - name: Check whether the Worker exists
        id: worker
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          name=$(grep -oE '"name"[[:space:]]*:[[:space:]]*"[^"]+"' docs/wrangler.jsonc \
                 | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          echo "worker name: $name"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/services/${name}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")
          echo "lookup returned HTTP $code"
          if [ "$code" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip preview (Worker not created yet)
        if: github.event_name == 'pull_request' && steps.worker.outputs.exists != 'true'
        run: |
          echo "::notice::Worker does not exist yet, so there is no version to \
          upload. It is created by the first deploy on main; preview deployments \
          work from the next pull request onward."

      # main -> the live site. Pull requests -> an immutable preview URL,
      # uploaded as a new version without shifting production traffic.
      - name: Deploy
        if: github.event_name == 'push' || steps.worker.outputs.exists == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: >-
            ${{ github.event_name == 'push'
                && 'deploy'
                || 'versions upload' }}
