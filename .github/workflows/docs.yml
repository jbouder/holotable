name: Docs

# The docs site is generated partly FROM the app source (the configuration
# reference from src/lib/config.ts, the viz list from src/lib/ir.ts), so a
# change to either must rebuild and redeploy the site.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/lib/config.ts"
      - "src/lib/ir.ts"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/lib/config.ts"
      - "src/lib/ir.ts"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      # `npm run build` runs scripts/generate-reference.mjs first, then Astro.
      # The build fails on a broken internal link (starlight-links-validator)
      # and on a reference page that can no longer be generated from source.
      - name: Build
        working-directory: docs
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    runs-on: ubuntu-latest
    # Forked pull requests have no access to secrets; they stop at `build`.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Build
        working-directory: docs
        run: npm run build

      # main -> the live site. Pull requests -> an immutable preview URL,
      # uploaded as a new version without shifting production traffic.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: >-
            ${{ github.event_name == 'push'
                && 'deploy'
                || 'versions upload' }}
