name: Docs

# The docs site is generated partly FROM the app source (the configuration
# reference from src/lib/config.ts, the viz list from the panel registry in
# src/lib/panels/), so a change to either must rebuild and redeploy the site.
# The same job checks the links in the root markdown files, which sit outside
# the site and its link validator.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # The configuration and visualization references are generated from
      # src/lib/config.ts and the panel registry, and the root-link check
      # below holds the root markdown files' backticked paths to src/,
      # scripts/, test/ and the rest. A rename anywhere can break either.
      - "src/**"
      - "scripts/**"
      - "test/**"
      - "migrations/**"
      - "deploy/**"
      - "*.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      # The same list as `push` above.
      - "src/**"
      - "scripts/**"
      - "test/**"
      - "migrations/**"
      - "deploy/**"
      - "*.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      # `npm run build` runs scripts/generate-reference.mjs first, then Astro.
      # The build fails on a broken internal link (starlight-links-validator)
      # and on a reference page that can no longer be generated from source.
      - name: Build
        working-directory: docs
        run: npm run build

      # README, CONTRIBUTING, SECURITY, AGENTS, the pull request template and
      # the chart README: relative links, links into the docs site and
      # backticked repository paths must all resolve. Offline, so a third
      # party's outage cannot fail it. Runs after the build because links to
      # the generated reference pages need them generated.
      - name: Check root markdown links
        working-directory: docs
        run: node scripts/check-root-links.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-dist
          path: docs/dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    runs-on: ubuntu-latest
    # Forked pull requests have no access to secrets; they stop at `build`.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Build
        working-directory: docs
        run: npm run build

      # `versions upload` (the preview path) requires the Worker to already
      # exist, and the Worker is only created by the first `deploy` on main.
      # Look it up so the first pull request skips the preview instead of
      # failing on that chicken-and-egg.
      - name: Check whether the Worker exists
        id: worker
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          name=$(grep -oE '"name"[[:space:]]*:[[:space:]]*"[^"]+"' docs/wrangler.jsonc \
                 | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          echo "worker name: $name"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/services/${name}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")
          echo "lookup returned HTTP $code"
          if [ "$code" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip preview (Worker not created yet)
        if: github.event_name == 'pull_request' && steps.worker.outputs.exists != 'true'
        run: |
          echo "::notice::Worker does not exist yet, so there is no version to \
          upload. It is created by the first deploy on main; preview deployments \
          work from the next pull request onward."

      # main -> the live site. Pull requests -> an immutable preview URL,
      # uploaded as a new version without shifting production traffic.
      - name: Deploy
        if: github.event_name == 'push' || steps.worker.outputs.exists == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: >-
            ${{ github.event_name == 'push'
                && 'deploy'
                || 'versions upload' }}
