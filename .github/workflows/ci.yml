name: CI

# Deliberately unfiltered by `paths`. The static-checks/test/build jobs are
# required status checks on `main`, and a required check that is skipped by a
# path filter never reports a conclusion — GitHub then blocks the pull request
# forever waiting for a run that will not happen. docs.yml can filter by path
# precisely because none of its jobs are required.
# The fuzz, which is not required either, skips itself on a pull request
# that touches no guard path (`guard-paths` below).
#
# A `v*` tag runs the whole pipeline too: `publish` below releases the images,
# and it only runs once every check has passed on that exact commit.
#
# Every Node job starts with ./.github/actions/setup (Node 22, `npm ci`), so a
# Node bump or an action update is one edit (#348).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # `biome ci` is the non-writing variant: it checks formatting and lint in
      # one pass and never applies a fix, so an unformatted file fails the build
      # rather than being silently rewritten. `npm run lint` (`biome check`) is
      # the same checks for local use.
      - name: Lint and format
        run: npx biome ci

      # `npm run typecheck` is `next typegen && tsc --noEmit`. The typegen step
      # is not optional: Next 16 writes the global route helpers (RouteContext,
      # PageProps, LayoutProps) into .next/types, which tsconfig.json includes.
      # On a cold checkout there is no .next, so a bare `tsc --noEmit` fails
      # with "Cannot find name 'RouteContext'" across every dynamic route
      # handler. `next typegen` generates those types without a full build.
      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Covers the SQL guardrails, the IR schema, authorization and time
      # resolution — the invariants the product rests on.
      - name: Test
        run: npm test

      # The server refuses to boot on an invalid configuration. This proves the
      # example file still starts a fresh checkout: in development mode missing
      # values are warnings, so a non-zero exit here means .env.example or the
      # validation rules changed in a way that would stop `npm run dev`. The
      # copy is removed again: every script loads `.env` (scripts/lib/env.ts),
      # and the replay below must run with no environment, as a checkout has.
      - name: Validate .env.example
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          npm run config:check

      # Grades every case's recorded answer with the current prompt, schema and
      # SQL guard (#24): no provider, no key, no spend. A failure means a
      # change made an answer that used to pass fail, and this job is required,
      # so it gates the pull request. The live run against a real model is
      # eval-nightly.yml, which reports and never gates.
      - name: Replay the eval corpus
        run: npm run eval -- --replay

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # No environment is provided on purpose: every value in src/lib/config.ts
      # has a fallback, so a production build must succeed with no .env at all.
      # If this job ever starts needing a secret to build, that is the bug.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # The image library Next's optimizer would use is excluded from the
      # standalone server (#498): nothing uses `next/image`, and it was a
      # third of the server's size. This fails if a change brings it back.
      - name: The standalone server carries no image library
        run: |
          if [ -e .next/standalone/node_modules/sharp ] || [ -e .next/standalone/node_modules/@img ]; then
            echo "::error::sharp or @img is in .next/standalone; see images.unoptimized in next.config.ts"
            exit 1
          fi

      # The other side of the trace (#615): `duckdb.node` loads libduckdb.so
      # with the dynamic linker, which the tracer cannot see, so
      # outputFileTracingIncludes adds it, for the glibc bindings only. Without
      # it the runtime image answers every DuckDB source "not available".
      - name: The standalone server carries libduckdb.so
        run: |
          shopt -s nullglob extglob
          glibc=(.next/standalone/node_modules/@duckdb/node-bindings-linux-@(x64|arm64)/libduckdb.so)
          musl=(.next/standalone/node_modules/@duckdb/node-bindings-linux-*-musl/libduckdb.so)
          if [ "${#glibc[@]}" -eq 0 ]; then
            echo "::error::no libduckdb.so under .next/standalone/node_modules/@duckdb/node-bindings-linux-*; see outputFileTracingIncludes in next.config.ts"
            exit 1
          fi
          if [ "${#musl[@]}" -ne 0 ]; then
            echo "::error::a musl libduckdb.so is in .next/standalone, which the Debian runtime image never loads: ${musl[*]}"
            exit 1
          fi
          ls -l "${glibc[@]}"

      # The end-to-end job runs this build rather than making its own (#610):
      # what `next start` reads, which is `.next` without the compiler's cache
      # and without the standalone server (the images build their own). A tar,
      # so the links Next writes under .next/node_modules to the packages it
      # keeps external stay links, resolved against that job's `npm ci`.
      - name: Pack the build for the end-to-end job
        run: tar -cf next-build.tar --exclude=.next/cache --exclude=.next/standalone .next

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-build
          path: next-build.tar
          if-no-files-found: error
          retention-days: 1

  # Did this pull request touch a guard (#611)? The fuzz below runs on a pull
  # request only when it did. The answer is a job of its own so the fuzz can
  # be skipped at the job level, which the checks list shows as "skipped",
  # rather than run with every step skipped, which it would show as a pass.
  #
  # A pull request is checked out as GitHub's merge commit, whose first parent
  # is the base branch as it stands, so `HEAD^1..HEAD` is exactly what the pull
  # request changes against it, with no third-party action and no API call.
  # Any other event (a push to main, a tag) always fuzzes.
  guard-paths:
    name: Guard paths changed?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      # The guard paths: the SQL, PromQL and LogQL guards; the DuckDB dialect,
      # which feeds the SQL guard; the fuzz corpora and the fuzz suites; and
      # the lockfile, since a parser upgrade changes what the guards see.
      # Keep this list and the one in CONTRIBUTING.md together.
      - id: filter
        name: Compare against the base branch
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "A ${EVENT} always runs the fuzz." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          guard=$(printf '%s\n' "$files" | grep -E \
            '^(src/lib/(sql|promql|logql|duckdb)/|test/fixtures/[^/]*-corpus\.ts$|test/[^/]*fuzz[^/]*$|package-lock\.json$)' || true)
          if [ -n "$guard" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "A guard path changed, so the fuzz runs:"
              echo
              echo "$guard" | sed 's/^/- `/; s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Fuzz skipped::No guard path changed, fuzz skipped."
            echo "No guard path changed, fuzz skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  fuzz:
    name: Fuzz the SQL guard
    needs: guard-paths
    if: github.event_name != 'pull_request' || needs.guard-paths.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # `npm test` already runs the SQL, PromQL and LogQL fuzz suites with a
      # fixed seed and a small iteration count, so the required Test job is
      # deterministic. This job runs them longer, with a fresh seed on every
      # run so it keeps exploring new inputs, in three tiers (#611): a pull
      # request that touches a guard path gets 5,000 iterations, a push to main
      # 20,000, and the nightly in fuzz.yml 100,000. It is deliberately not a
      # required check: a failure here is a real finding against main, not
      # necessarily against the pull request. The failure output prints the
      # exact statement and a FUZZ_SEED/FUZZ_PATH line to replay it locally.
      - name: Fuzz
        run: npm run test:fuzz
        env:
          FUZZ_RUNS: ${{ github.event_name == 'pull_request' && '5000' || '20000' }}
          FUZZ_SEED: ${{ github.run_id }}

  database:
    name: Database
    runs-on: ubuntu-latest
    env:
      # The migration checks run on a bare database, as they always have:
      # the round-trip drops and recreates `public`, which also takes the
      # TimescaleDB extension with it. The integration suites run on the
      # database the init scripts set up, which that drop would have broken.
      # Two databases, one server, one container.
      DATABASE_URL: postgresql://holotable:holotable@127.0.0.1:5432/migrations
      INTEGRATION_URL: postgresql://holotable:holotable@127.0.0.1:5432/holotable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # One scratch TimescaleDB for both halves of this job, started after the
      # checkout so it can mount timescaledb/init: the same image, the same
      # init scripts (the `metrics` schema, its hypertables, the read-only
      # role) that compose and the Testcontainers path of
      # `npm run test:integration` use. A `services:` container cannot mount
      # the checkout, since it starts before there is one. TimescaleDB rather
      # than plain Postgres on purpose — a rollback that fails only with the
      # extension loaded is exactly what a parse-only dry run misses.
      - name: Start TimescaleDB
        run: |
          docker run -d --name timescaledb -p 5432:5432 \
            -e POSTGRES_USER=holotable -e POSTGRES_PASSWORD=holotable -e POSTGRES_DB=holotable \
            -v "$PWD/timescaledb/init:/docker-entrypoint-initdb.d:ro" \
            timescale/timescaledb:2.30.2-pg16
          for _ in $(seq 1 40); do
            # pg_isready answers during the init scripts too; the role they
            # create last is what says they finished.
            if docker exec timescaledb psql -U holotable -d holotable -tAc \
                "SELECT 1 FROM pg_roles WHERE rolname = 'metrics_ro'" 2>/dev/null | grep -q 1; then
              docker exec timescaledb psql -U holotable -d holotable -q -c 'CREATE DATABASE migrations'
              exit 0
            fi
            sleep 2
          done
          echo "::error::TimescaleDB did not come up"
          docker logs timescaledb
          exit 1

      # The deploy gate, proven in both directions. On a fresh database every
      # migration is pending, so --check must fail; after applying them it must
      # pass. A deploy pipeline runs the second form before rolling out, and a
      # deploy whose code needs a migration that has not run fails there
      # instead of in the request path.
      - name: --check fails when migrations are pending
        run: |
          if npm run migrate --silent -- --check; then
            echo "::error::--check passed on an unmigrated database"
            exit 1
          fi

      - name: --dry-run applies nothing
        run: |
          npm run migrate --silent -- --dry-run
          if npm run migrate --silent -- --check; then
            echo "::error::--dry-run left migrations applied"
            exit 1
          fi

      - name: Apply, then --check passes
        run: |
          npm run migrate --silent
          npm run migrate --silent -- --check

      # From empty to fully applied and back: every down path runs against the
      # real server and must land on exactly the schema its predecessor left,
      # re-applying must land back where it was, and re-running the whole set
      # must be a no-op. Needs the database it just migrated to be empty again.
      - name: Round-trip every migration
        run: |
          docker exec timescaledb psql -U holotable -d migrations -q -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          npm run migrate:verify

      # Every real-server suite (#87): read-only execution, statement timeouts,
      # SQLSTATE mapping, the allowlist end to end, repository round trips and
      # a poller ticking over real rows. Pointed at the init-script database
      # above instead of starting a second server through Testcontainers; the
      # runner applies the migrations itself first, exactly as `npm run
      # migrate` does, so the suites see what a fresh container would give.
      - name: Integration tests
        run: npm run test:integration
        env:
          MIGRATE_TEST_DATABASE_URL: ${{ env.INTEGRATION_URL }}

      - name: Logs
        if: failure()
        run: docker logs timescaledb --tail 200

  e2e:
    name: End-to-end and accessibility
    # Runs the build job's output (#610), so it never runs `next build`
    # itself, and waits for the test job rather than spending a stack
    # bring-up on a failing unit test. Not a required check yet: a browser
    # suite earns that after it has been quiet on main for a while.
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build

      - name: Unpack the build
        run: tar -xf next-build.tar && rm next-build.tar

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # e2e/prepare.ts brings up e2e/compose.yml (TimescaleDB, Keycloak with
      # the dev realm, a Prometheus that scrapes the app, #390, and a Loki it
      # pushes a few labeled lines to, #567) and migrates; Playwright then
      # starts the stub model endpoint, the seeder and the build unpacked
      # above, signs in through the realm, and runs the specs: the parallel
      # project on four workers, then the serial one (#610). The model is the
      # recorded stub, so nothing here calls a provider.
      - name: End-to-end
        run: npm run e2e
        env:
          E2E_SKIP_BUILD: 1
          NEXT_TELEMETRY_DISABLED: 1

      - name: Traces, screenshots and the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14

      - name: Logs
        if: failure()
        run: docker compose -f e2e/compose.yml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: npm run e2e:down

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Pinned so a chart that renders here renders the same next week.
          # The chart itself is apiVersion v2 and uses nothing newer than
          # Kubernetes 1.25 APIs, so Helm 4 renders it identically.
          version: v3.16.4

      - name: Lint
        run: helm lint deploy/helm/holotable

      # The default values must render: a chart that needs a values file to
      # produce valid YAML cannot be inspected by anyone evaluating it.
      - name: Template with defaults
        run: helm template holotable deploy/helm/holotable > /dev/null

      # The three secret wirings in the chart README are runnable values files,
      # not prose. This is what keeps them that way.
      - name: Template every example
        run: |
          for f in deploy/helm/holotable/examples/*.yaml; do
            echo "::group::$f"
            helm template holotable deploy/helm/holotable -f "$f" > /dev/null
            echo "::endgroup::"
          done

      # Every optional object at once: Ingress, HPA, PDB, NetworkPolicy, a
      # chart-managed Secret, and the source-credential mount.
      - name: Template every optional object
        run: |
          helm template holotable deploy/helm/holotable \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set podDisruptionBudget.minAvailable=null \
            --set podDisruptionBudget.maxUnavailable=1 \
            --set networkPolicy.enabled=true \
            --set networkPolicy.ingressFrom[0].namespaceSelector.matchLabels."kubernetes\.io/metadata\.name"=ingress-nginx \
            --set secrets.create=true \
            --set secrets.values.SESSION_SECRET=not-a-real-secret \
            --set sourceSecrets.secretName=holotable-sources \
            --set 'ai.models[0].name=claude' \
            --set 'ai.models[0].provider=anthropic' \
            --set 'ai.models[0].model=claude-sonnet-5-5' \
            --set 'ai.models[0].credentials.apiKey=ANTHROPIC_API_KEY' \
            > /dev/null

      # The guard that keeps invariant 5 (no credential in a client-visible or
      # cluster-readable payload) true for the chart: `config` becomes a
      # ConfigMap, so a credential there is readable by anyone who can read the
      # namespace. The render must refuse.
      - name: A credential in `config` fails the render
        run: |
          if helm template holotable deploy/helm/holotable \
            --set config.SESSION_SECRET=oops > /dev/null 2>&1; then
            echo "::error::a credential in .Values.config rendered instead of failing"
            exit 1
          fi

      # The other render-time guard: a grace period below the drain budget
      # means the kubelet SIGKILLs the server mid-drain, which silently undoes
      # the graceful shutdown the probes and preStop hook are there to deliver.
      - name: A grace period below the drain budget fails the render
        run: |
          if helm template holotable deploy/helm/holotable \
            --set terminationGracePeriodSeconds=5 > /dev/null 2>&1; then
            echo "::error::terminationGracePeriodSeconds below the drain budget rendered instead of failing"
            exit 1
          fi

      # The heap guard (#495): the heap is three quarters of the memory
      # limit, and a limit too small to hold the pollers must refuse to
      # render rather than deploy a pod that is OOM-killed under load.
      - name: A memory limit below the heap floor fails the render
        run: |
          if helm template holotable deploy/helm/holotable \
            --set resources.limits.memory=128Mi > /dev/null 2>&1; then
            echo "::error::a memory limit below 256Mi rendered instead of failing"
            exit 1
          fi
          helm template holotable deploy/helm/holotable --set resources.limits.memory=2Gi \
            | grep -q -- '--max-old-space-size=1536'

      # The same invariant for `ai.models` (#440): the models file is a
      # ConfigMap, so an entry's credentials must name a variable, never hold
      # the key. The render must refuse a value.
      - name: A credential value in `ai.models` fails the render
        run: |
          if helm template holotable deploy/helm/holotable \
            --set 'ai.models[0].name=claude' \
            --set 'ai.models[0].provider=anthropic' \
            --set 'ai.models[0].model=claude-sonnet-5-5' \
            --set 'ai.models[0].credentials.apiKey=sk-ant-oops' > /dev/null 2>&1; then
            echo "::error::a credential value in .Values.ai.models rendered instead of failing"
            exit 1
          fi

  images:
    name: Images and smoke
    # The images run `npm run build` inside their shared build stage, and the
    # smoke test brings the whole compose stack up, so this waits for the cheaper
    # jobs to have their say first: a type error or a failing unit test should
    # not cost an image build and a stack bring-up to discover.
    needs: [test, build]
    runs-on: ubuntu-latest
    env:
      # What docker-compose.yml names its images, with the tag below picked
      # through HOLOTABLE_TAG, so the stack runs exactly the images this job
      # built and never builds its own.
      IMAGE: ghcr.io/jbouder/holotable
      TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only — never pushed. A pull request runs with a read-only token
      # and may come from a fork; publishing is `publish` below, on `main`.
      # Loaded into the runner's Docker so the smoke test can run it.
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The job image compose runs migrate, seed, self-metrics and smoke from.
      # It shares the `deps` stage with the build above, so this is mostly a
      # cache hit; it is here so a change to `scripts/` or `migrations/` that
      # breaks the target fails CI instead of the next `docker compose up`.
      - name: Build migrate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-migrate
          cache-from: type=gha

      # The all-in-one quick-start image (#253): TimescaleDB, the server and
      # the demo jobs on Alpine. The `quickstart` target of the same
      # Dockerfile (#612): it installs its own musl node_modules and copies
      # the app from the `build` stage the runtime image built above, which
      # this build reports CACHED rather than running `next build` again.
      # Loaded, so the step after the compose smoke can run it exactly as
      # `docker run` does. Its own cache scope, so its layers do not replace
      # the runtime image's in the default one, which it also reads.
      - name: Build quick-start image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: quickstart
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-quickstart
          cache-from: |
            type=gha
            type=gha,scope=quickstart
          cache-to: type=gha,scope=quickstart,mode=max

      # The app refuses to boot on an invalid configuration, and in production
      # mode a missing OIDC client or model id is an error rather than a
      # warning. None of it is exercised by this job — nothing logs in and no
      # model is called — but the values have to be there for the server to
      # start at all. The secret is generated per run; there is nothing to
      # keep.
      - name: Write a compose environment
        run: |
          cat > .env <<EOF
          HOLOTABLE_TAG=${TAG}
          SESSION_SECRET=$(openssl rand -hex 32)
          METRICS_TOKEN=$(openssl rand -hex 32)
          OIDC_ISSUER=http://localhost:8080/realms/holotable
          OIDC_CLIENT_ID=holotable
          OIDC_CLIENT_SECRET=$(openssl rand -hex 16)
          OIDC_JWKS_URL=http://localhost:8080/realms/holotable/protocol/openid-connect/certs
          AI_PROVIDER=openai-compatible
          AI_MODEL=gpt-4o-mini
          OPENAI_BASE_URL=http://127.0.0.1:1/v1
          OPENAI_API_KEY=unused-in-ci
          # Four scrapes a minute is the shipped default; CI has no time for it.
          SELF_METRICS_INTERVAL_MS=5000
          SMOKE_TIMEOUT_MS=240000
          EOF

      # No `--build`: the images above are already in the runner's Docker
      # under the tag the .env names, and compose uses an image that exists.
      # `--wait` holds until the app reports healthy, which is its own
      # liveness probe, so a server that exited on a bad configuration fails
      # here with its logs rather than 4 minutes later as a smoke timeout.
      # With the `logs` profile, so Loki and Alloy hold the stack's own log
      # lines for the third self-monitoring dashboard (#567).
      - name: Bring the stack up
        run: docker compose --profile logs up -d --wait app seed self-metrics prometheus loki alloy

      # The assertion: the three seeded self-monitoring dashboards answer with
      # rows, the SQL one from what the collector scraped out of the running
      # app, the PromQL one from what Prometheus scraped (#390), and the LogQL
      # one from the app's lines Alloy shipped to Loki (#567), through the
      # same guard and executor POST /api/query uses; and the service health
      # demo answers too, its custom visual compiling (#405); and the files demo
      # answers from the Parquet and CSV files the seeder wrote, through the
      # DuckDB kind (#574).
      - name: Smoke
        run: docker compose --profile smoke run --rm smoke

      - name: Logs
        if: failure()
        run: docker compose --profile logs logs --no-color --tail 200

      # The quick-start image with no flags at all (#600), as the docs tell
      # people to run it: local mode, so the visitor is the owner and can
      # upload. Its seeded dashboards answer through `npm run smoke` run
      # inside it, and smoke-quickstart walks the upload journey over HTTP:
      # sign in, upload the sample CSV, create a source and a dashboard over
      # it, query it. The compose stack is down first, for the port.
      - name: Quick-start image
        run: |
          docker compose --profile logs down --volumes --remove-orphans
          docker run -d --name quickstart -p 3000:3000 "${IMAGE}:${TAG}-quickstart"
          for _ in $(seq 1 90); do
            status="$(docker inspect -f '{{.State.Health.Status}}' quickstart)"
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' quickstart)" = true ] || break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' quickstart | grep -qx healthy
          docker exec -e SMOKE_TIMEOUT_MS=240000 quickstart node node_modules/.bin/tsx scripts/smoke.ts
          docker exec quickstart node node_modules/.bin/tsx scripts/smoke-quickstart.ts

      - name: Quick-start logs
        if: failure()
        run: docker logs --tail 200 quickstart || true

      - name: Tear down
        if: always()
        run: docker compose --profile logs down --volumes --remove-orphans

  # Publishes ghcr.io/<owner>/holotable (#250). Each target is built natively
  # on an amd64 and an arm64 runner and pushed by digest, then
  # `publish-manifest` stitches the two digests into one multi-arch tag. Native
  # runners rather than QEMU because `npm ci` and `next build` under emulation
  # take several times as long.
  #
  # Tags, one image name for both targets (the Helm chart's convention):
  #
  #   on main      sha-<short>          sha-<short>-migrate
  #                main                 main-migrate
  #   on v1.2.3    1.2.3                1.2.3-migrate
  #                latest, runtime      latest-migrate, migrate
  #
  # The quick-start image (#253) follows the same scheme with a `-quickstart`
  # suffix, except that its floating `quickstart` tag moves on every push to
  # main rather than on a release: it is the evaluation image behind
  # `docker run ghcr.io/jbouder/holotable:quickstart` and the hosted demo, both
  # of which should show what is on main.
  #
  # Gated on every required check, so nothing is published from a commit that
  # fails lint, types, tests or the build.
  publish:
    name: Publish ${{ matrix.target }} (${{ matrix.arch }})
    if: github.event_name == 'push'
    needs: [static, test, build]
    strategy:
      fail-fast: true
      matrix:
        target: [runtime, migrate, quickstart]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `/api/health` reports package.json's version (src/lib/version.ts). A
      # tag that disagrees with it would publish `1.2.3` reporting `1.2.2`.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only; the tags are applied to the multi-arch index in
      # `publish-manifest`. `org.opencontainers.image.source` is what links
      # the GHCR package to this repository.
      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # One Dockerfile for all three targets (#612), so a release builds
          # through the same stages as the "Images and smoke" job above.
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamped into GET /api/health.
          build-args: GIT_COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=publish-${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,scope=publish-${{ matrix.target }}-${{ matrix.arch }},mode=max

      - name: Record the digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish ${{ matrix.target }} manifest
    needs: publish
    strategy:
      matrix:
        target: [runtime, migrate, quickstart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is written explicitly, only on a release tag, so a merge to
      # `main` never moves it. The suffix keeps both targets under one image
      # name; `value=<target>,suffix=` is the floating `runtime` / `migrate`
      # alias for the newest release.
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.target != 'runtime' && format('-{0}', matrix.target) || '' }},onlatest=true
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ matrix.target }},suffix=,enable=${{ startsWith(github.ref, 'refs/tags/v') && matrix.target != 'quickstart' }}
            type=raw,value=quickstart,suffix=,enable=${{ matrix.target == 'quickstart' && github.ref == 'refs/heads/main' }}

      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
