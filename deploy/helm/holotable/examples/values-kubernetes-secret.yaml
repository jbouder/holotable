# Wiring 1 of 3 — a Kubernetes Secret you create yourself.
#
# The plainest option, and the right one unless you already run a secret
# manager. The Secret's keys are environment variable names verbatim, because
# the chart loads it with `envFrom`.
#
#   kubectl create secret generic holotable-env \
#     --from-literal=SESSION_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=DATABASE_URL='postgresql://holotable:...@postgres:5432/holotable' \
#     --from-literal=OIDC_CLIENT_SECRET='...' \
#     --from-literal=OPENAI_API_KEY='...' \
#     --from-literal=TS_METRICS_USERNAME='metrics_ro' \
#     --from-literal=TS_METRICS_PASSWORD='...'
#
# The last pair is a source `secret_ref` family: a source stores the *name*
# `TS_METRICS` and the server resolves `TS_METRICS_USERNAME` /
# `TS_METRICS_PASSWORD` from its own environment at execution time. One pair
# per source, and none of it is ever written to the database.
#
#   helm install holotable deploy/helm/holotable -f values-kubernetes-secret.yaml

secrets:
  existingSecret: holotable-env

config:
  OIDC_ISSUER: https://kc.example.com/realms/holotable
  OIDC_CLIENT_ID: holotable
  OIDC_JWKS_URL: https://kc.example.com/realms/holotable/protocol/openid-connect/certs
  OIDC_REDIRECT_URI: https://holotable.example.com/api/auth/callback
  OIDC_SCOPE: openid profile email groups
  AI_PROVIDER: openai-compatible
  OPENAI_BASE_URL: https://openrouter.ai/api/v1
  AI_MODEL: openai/gpt-4o-mini
  TS_METRICS_HOST: timescaledb.databases.svc.cluster.local
  TS_METRICS_PORT: "5432"

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: holotable.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: holotable-tls
      hosts:
        - holotable.example.com
