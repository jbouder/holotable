# Wiring 3 of 3 — the Secrets Store CSI driver.
#
# Apply a SecretProviderClass alongside the release (it belongs to your cluster,
# not to this chart) with `secretObjects` set, so the driver *also* syncs the
# mounted values into a Kubernetes Secret. The app then reads that Secret with
# `envFrom` exactly as in wiring 1.
#
#   apiVersion: secrets-store.csi.x-k8s.io/v1
#   kind: SecretProviderClass
#   metadata:
#     name: holotable
#   spec:
#     provider: azure            # or aws, gcp, vault
#     parameters: { ... }        # provider-specific
#     secretObjects:
#       - secretName: holotable-env
#         type: Opaque
#         data:
#           - objectName: session-secret
#             key: SESSION_SECRET
#           - objectName: database-url
#             key: DATABASE_URL
#           - objectName: ts-metrics-password
#             key: TS_METRICS_PASSWORD
#
# The volume mount below is not optional even though the app reads none of the
# files: the driver only creates and refreshes the synced Secret while a pod
# mounts the volume. Without the mount the Secret is never written, and the
# first rollout comes up with no credentials at all.
#
#   helm install holotable deploy/helm/holotable -f values-secrets-store-csi.yaml

secrets:
  existingSecret: holotable-env

extraVolumes:
  - name: secrets-store
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: holotable

extraVolumeMounts:
  - name: secrets-store
    mountPath: /mnt/secrets-store
    readOnly: true

config:
  OIDC_ISSUER: https://kc.example.com/realms/holotable
  OIDC_CLIENT_ID: holotable
  OIDC_JWKS_URL: https://kc.example.com/realms/holotable/protocol/openid-connect/certs
  OIDC_REDIRECT_URI: https://holotable.example.com/api/auth/callback
  AI_PROVIDER: openai-compatible
  OPENAI_BASE_URL: https://openrouter.ai/api/v1
  AI_MODEL: openai/gpt-4o-mini
  # The `ops` workspace (the `/workspaces/ops/…` groups) may use TS_METRICS.
  SOURCE_SECRET_REFS: "TS_METRICS:ops"

# `extraVolumes` / `extraVolumeMounts` are applied to the migration Job too, and
# that is deliberate: the Job runs first, as a pre-install hook, and needs
# DATABASE_URL from the synced Secret. The driver writes that Secret while
# mounting the volume, which the kubelet does before it creates the container —
# so the very first install works with nothing pre-created.
