{{- if .Values.secrets.create }}
{{- if not .Values.secrets.values }}
{{- fail "secrets.create is true but secrets.values is empty. Either fill it in or set secrets.existingSecret and leave the Secret out of your values file." }}
{{- end }}
{{- if .Values.secrets.existingSecret }}
{{- fail "secrets.create and secrets.existingSecret are both set; the app would be handed two credential sources. Pick one." }}
{{- end }}
# A chart-managed Secret. Convenient, and the weakest of the four wirings in the
# README: these values live in your values file, in `helm get values`, and in
# whatever stores your release history.
#
# It is a hook, weighted ahead of the migration Job, because that Job is a
# pre-install hook and an ordinary release resource would not exist yet when it
# runs. The delete policy is deliberately not `hook-succeeded`: the app reads
# this Secret for as long as it runs. The cost is that `helm uninstall` leaves
# it behind — one more reason to prefer `secrets.existingSecret`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "holotable.fullname" . }}
  labels:
    {{- include "holotable.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: {{ sub (int .Values.migrations.hookWeight) 10 | quote }}
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
