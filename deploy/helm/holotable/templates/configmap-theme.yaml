{{- if .Values.theme.file }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "holotable.fullname" . }}-theme
  labels:
    {{- include "holotable.labels" . | nindent 4 }}
data:
  # THEME_FILE (#508): token values only, checked by the server at boot.
  theme.json: {{ .Values.theme.file | toJson | quote }}
{{- end }}
