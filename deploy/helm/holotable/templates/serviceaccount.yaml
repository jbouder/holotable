{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "holotable.serviceAccountName" . }}
  labels:
    {{- include "holotable.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The app talks to Postgres, Keycloak, and a model provider — never to the
# Kubernetes API — so it has no use for a mounted token.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
