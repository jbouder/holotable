apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "holotable.fullname" . }}
  labels:
    {{- include "holotable.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # maxUnavailable 0: the replacement pod must pass its readiness probe before
  # the old one is asked to stop, so a rolling update never leaves the Service
  # with no endpoint. Together with the preStop sleep and the drain, that is
  # what makes an upgrade invisible to a browser holding an SSE stream open.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "holotable.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the rendered configuration changes; without this a
        # `helm upgrade` that only touches `config` leaves the old environment
        # running, because the ConfigMap is loaded with envFrom at start.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "holotable.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "holotable.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ include "holotable.terminationGracePeriodSeconds" . }}
      containers:
        - name: app
          image: {{ include "holotable.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.app.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.app.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            # Next's own SIGTERM handler exits 143 without draining and wins the
            # race against the app's. The image sets this too; it is restated
            # here because every guarantee below — the readiness flip, the SSE
            # reconnect hint, the grace period — depends on it.
            - name: NEXT_MANUAL_SIG_HANDLE
              value: "true"
            {{- if .Values.sourceSecrets.secretName }}
            - name: SOURCE_SECRETS_DIR
              value: {{ .Values.sourceSecrets.mountPath | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            {{- include "holotable.envFrom" . | nindent 12 }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          lifecycle:
            {{- if .Values.lifecycle }}
            {{- toYaml .Values.lifecycle | nindent 12 }}
            {{- else }}
            # Endpoint removal is asynchronous: kube-proxy and the ingress
            # controller learn about a terminating pod at their own pace. Sleep
            # first so that work stops arriving before SIGTERM starts the drain.
            # `exec` rather than the native `sleep` handler to stay compatible
            # below Kubernetes 1.30; `/bin/sleep` is in the Debian-slim base.
            preStop:
              exec:
                command:
                  - /bin/sleep
                  - {{ .Values.app.preStopSleepSeconds | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only. These are the only two paths
            # the server writes to.
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
            {{- if .Values.sourceSecrets.secretName }}
            # Mounted whole, never with subPath: a subPath mount is a copy the
            # kubelet does not refresh, which would bring the restart back.
            - name: source-secrets
              mountPath: {{ .Values.sourceSecrets.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
        {{- if .Values.sourceSecrets.secretName }}
        - name: source-secrets
          secret:
            secretName: {{ .Values.sourceSecrets.secretName }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
