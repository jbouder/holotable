# The end-to-end suite's dependencies (#88): TimescaleDB with the demo metrics
# schema, Keycloak with the dev realm, Prometheus scraping the app (#390), and
# Loki (#567), which e2e/prepare.ts fills with a few labeled lines. A project of its own, on ports of
# its own, so `npm run e2e` never writes into the database or the realm a
# contributor develops against. The app is not in here: Playwright builds and
# starts it on the host (e2e/playwright.config.ts), because the production
# build is what the suite is meant to exercise.
#
#   docker compose -f e2e/compose.yml up -d --wait
#   docker compose -f e2e/compose.yml down --volumes
name: holotable-e2e

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: holotable
      POSTGRES_PASSWORD: holotable
      POSTGRES_DB: holotable
      TS_METRICS_USERNAME: metrics_ro
      TS_METRICS_PASSWORD: readonly
    ports:
      - "${E2E_PG_PORT:-55433}:5432"
    volumes:
      - ../timescaledb/init:/docker-entrypoint-initdb.d:ro
    # No volume for the data directory: every bring-up starts from an empty
    # database, so a run never depends on what the last one left behind.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U holotable -d holotable"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command:
      - start-dev
      - --import-realm
      - --http-port=${E2E_KC_PORT:-18181}
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    # The issuer is the URL the browser uses, so Keycloak listens on the same
    # port inside the container as the one published outside it.
    ports:
      - "${E2E_KC_PORT:-18181}:${E2E_KC_PORT:-18181}"
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; bash's /dev/tcp is enough to ask the management
      # port whether the realm import has finished.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          grep -q UP <&3
      interval: 3s
      timeout: 3s
      retries: 60

  # Scrapes the app on the host every two seconds, so a Prometheus source has
  # live series within a test's patience (#390). Its own metrics too, which
  # give `up` a second series.
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=:${E2E_PROM_PORT:-19190}
      - --storage.tsdb.retention.time=1h
    ports:
      - "${E2E_PROM_PORT:-19190}:${E2E_PROM_PORT:-19190}"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${E2E_PROM_PORT:-19190}/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A Loki source's endpoint (#567). No shipper: e2e/prepare.ts pushes a few
  # labeled JSON lines to /loki/api/v1/push, the one write this stack makes
  # (Holotable only reads), so the labels and values discovery finds are known
  # in advance. The image is distroless, with no shell for a healthcheck, so
  # prepare.ts waits on /ready itself.
  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "${E2E_LOKI_PORT:-13100}:${E2E_LOKI_PORT:-13100}"
    configs:
      - source: loki_config
        target: /etc/loki/loki.yaml

configs:
  loki_config:
    content: |
      auth_enabled: false
      server:
        http_listen_port: ${E2E_LOKI_PORT:-13100}
        log_level: warn
      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      analytics:
        reporting_enabled: false

  prometheus_config:
    content: |
      global:
        scrape_interval: 2s
      scrape_configs:
        - job_name: holotable
          metrics_path: /api/metrics
          authorization:
            credentials: "${E2E_SCRAPE_TOKEN:-e2e-scrape-token-0123456789}"
          static_configs:
            - targets: ["host.docker.internal:${E2E_PORT:-3107}"]
        - job_name: prometheus
          static_configs:
            - targets: ["127.0.0.1:${E2E_PROM_PORT:-19190}"]
