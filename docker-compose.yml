# The scrape token the local stack uses. GET /api/metrics is closed until one
# of METRICS_TOKEN / METRICS_ALLOWED_CIDRS is set (src/lib/metrics-access.ts),
# and the self-monitoring collector below has to get in, so this file carries a
# default the way it already carries the `holotable` Postgres password: it
# guards a scrape on the compose network and nothing else. Set METRICS_TOKEN in
# .env — `openssl rand -hex 32` — for anything reachable from anywhere else.
x-metrics-token: &metrics-token ${METRICS_TOKEN:-holotable-local-demo-scrape}

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: holotable
      POSTGRES_PASSWORD: holotable
      POSTGRES_DB: holotable
      TS_METRICS_USERNAME: ${TS_METRICS_USERNAME:-metrics_ro}
      TS_METRICS_PASSWORD: ${TS_METRICS_PASSWORD:-readonly}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holotable"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-holotable}:${POSTGRES_PASSWORD:-holotable}@postgres:5432/holotable"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      args:
        # Stamped into GET /api/health. Optional; reads "unknown" when unset.
        GIT_COMMIT: ${GIT_COMMIT:-}
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-holotable}:${POSTGRES_PASSWORD:-holotable}@postgres:5432/holotable"
      SESSION_SECRET: ${SESSION_SECRET:?set a strong 32+ char SESSION_SECRET}
      # Which workspaces may use which source secret_ref. The seeder registers
      # the demo sources in the `demo` workspace; a ref not granted here never
      # resolves, whatever credentials the environment holds.
      SOURCE_SECRET_REFS: ${SOURCE_SECRET_REFS:-TS_METRICS:demo}
      # Credentials the app resolves for the 'TS_METRICS' source secret_ref.
      TS_METRICS_USERNAME: ${TS_METRICS_USERNAME:-metrics_ro}
      TS_METRICS_PASSWORD: ${TS_METRICS_PASSWORD:-readonly}
      # AI provider (see .env.example / docs).
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_MODEL: ${AI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      # Keycloak OIDC.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid profile email}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_ACCOUNT_URL: ${OIDC_ACCOUNT_URL:-}
      # Prometheus scrape gate. /api/metrics answers 404 until one is set.
      METRICS_TOKEN: *metrics-token
      METRICS_ALLOWED_CIDRS: ${METRICS_ALLOWED_CIDRS:-}
    ports:
      - "3000:3000"
    # `docker compose stop` sends SIGTERM and waits this long before SIGKILL.
    # Must exceed SHUTDOWN_GRACE_MS (default 10s) or the drain is cut short.
    stop_grace_period: 20s
    # Liveness, the same probe the image's own HEALTHCHECK runs, restated on a
    # shorter cadence so `docker compose up` reaches a healthy app quickly.
    # Readiness (/api/ready) is an orchestrator concern: it fails whenever the
    # database is away, and compose should not call the container unhealthy for
    # that.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    # OIDC URLs use localhost:8080 (browser-facing). Map localhost to the host
    # gateway so server-side JWKS/token fetches inside this container reach the
    # published Keycloak port instead of the container's own loopback.
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  seed:
    build:
      context: .
      target: migrate
    command: ["node", "node_modules/.bin/tsx", "scripts/seed.ts"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-holotable}:${POSTGRES_PASSWORD:-holotable}@postgres:5432/holotable"
      TIMESCALEDB_URL: "postgresql://${POSTGRES_USER:-holotable}:${POSTGRES_PASSWORD:-holotable}@postgres:5432/holotable"
      TS_METRICS_HOST: postgres
      TS_METRICS_PORT: "5432"
      SEED_INTERVAL_MS: "2000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The self-monitoring demo (#54). Scrapes the app's own /api/metrics and
  # lands the samples in metrics.holotable_self, which `seed` registers as the
  # `holotable-self` source — so the shipped demo is Holotable reading guarded
  # SQL over data it produced itself. Prometheus below is not in this path;
  # Holotable reads SQL, not PromQL, so something has to land the samples in a
  # table, and a ~100-line collector is the smaller honest answer.
  self-metrics:
    build:
      context: .
      target: migrate
    command: ["node", "node_modules/.bin/tsx", "scripts/self-metrics.ts"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-holotable}:${POSTGRES_PASSWORD:-holotable}@postgres:5432/holotable"
      TIMESCALEDB_URL: "postgresql://${POSTGRES_USER:-holotable}:${POSTGRES_PASSWORD:-holotable}@postgres:5432/holotable"
      METRICS_URL: http://app:3000/api/metrics
      METRICS_TOKEN: *metrics-token
      SELF_METRICS_INTERVAL_MS: ${SELF_METRICS_INTERVAL_MS:-15000}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # End-to-end check, off by default:
  #   docker compose --profile smoke run --rm smoke
  # Waits for the self-monitoring dashboard to answer with real rows through
  # the same guard and executor POST /api/query uses, and fails otherwise.
  smoke:
    profiles: ["smoke"]
    build:
      context: .
      target: migrate
    command: ["node", "node_modules/.bin/tsx", "scripts/smoke.ts"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-holotable}:${POSTGRES_PASSWORD:-holotable}@postgres:5432/holotable"
      # Resolved for the `TS_METRICS` secret_ref, exactly as the app resolves it
      # — including the grant, which the demo workspace needs as well.
      SOURCE_SECRET_REFS: ${SOURCE_SECRET_REFS:-TS_METRICS:demo}
      TS_METRICS_USERNAME: ${TS_METRICS_USERNAME:-metrics_ro}
      TS_METRICS_PASSWORD: ${TS_METRICS_PASSWORD:-readonly}
      SMOKE_TIMEOUT_MS: ${SMOKE_TIMEOUT_MS:-180000}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Scrapes the app's /api/metrics. Off by default — start it with
  # `docker compose --profile metrics up -d prometheus`. Not part of the
  # self-monitoring demo above, which reads SQL rather than PromQL; this is
  # here for anyone who wants the real scraper and its alerting.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["metrics"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    depends_on:
      app:
        condition: service_healthy

# Inline so the bearer token comes from the same .env as the app's, instead of
# living in a second checked-in file that would have to hold it in clear text.
configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: holotable
          metrics_path: /api/metrics
          authorization:
            credentials: "${METRICS_TOKEN:-holotable-local-demo-scrape}"
          static_configs:
            - targets: ["app:3000"]

volumes:
  pgdata:
