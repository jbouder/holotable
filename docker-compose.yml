# The scrape token the local stack uses. GET /api/metrics is closed until one
# of METRICS_TOKEN / METRICS_ALLOWED_CIDRS is set (src/lib/metrics-access.ts),
# and the self-monitoring collector below has to get in, so this file carries a
# default the way it already carries the `holotable` Postgres password: it
# guards a scrape on the compose network and nothing else. Set METRICS_TOKEN in
# .env — `openssl rand -hex 32` — for anything reachable from anywhere else.
x-metrics-token: &metrics-token ${METRICS_TOKEN:-holotable-local-demo-scrape}

# The published images (#250). `docker compose up` pulls these; `docker compose
# up --build` builds them from this checkout instead, under the same names, which
# is what a contributor wants. HOLOTABLE_TAG picks the published tag: `main`
# (the default) follows the main branch, a version such as `0.2.0` pins a
# release. The job services (migrate, seed, self-metrics, smoke) share the
# `migrate` target, so they share one image.
x-runtime-image: &runtime-image ghcr.io/jbouder/holotable:${HOLOTABLE_TAG:-main}
x-migrate-image: &migrate-image ghcr.io/jbouder/holotable:${HOLOTABLE_TAG:-main}-migrate

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: holotable
      POSTGRES_PASSWORD: holotable
      POSTGRES_DB: holotable
      TS_METRICS_USERNAME: ${TS_METRICS_USERNAME:-metrics_ro}
      TS_METRICS_PASSWORD: ${TS_METRICS_PASSWORD:-readonly}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holotable"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    # Back-channel logout (#28): the realm POSTs to the app at
    # host.docker.internal:3000, which reaches the published port whether the
    # app runs in this stack or as `npm run dev` on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  migrate:
    image: *migrate-image
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-holotable}:${POSTGRES_PASSWORD:-holotable}@postgres:5432/holotable"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: *runtime-image
    build:
      context: .
      args:
        # Stamped into GET /api/health. Optional; reads "unknown" when unset.
        GIT_COMMIT: ${GIT_COMMIT:-}
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-holotable}:${POSTGRES_PASSWORD:-holotable}@postgres:5432/holotable"
      SESSION_SECRET: ${SESSION_SECRET:?set a strong 32+ char SESSION_SECRET}
      # Which workspaces may use which source secret_ref. The seeder registers
      # the demo sources in the `demo` workspace; a ref not granted here never
      # resolves, whatever credentials the environment holds.
      SOURCE_SECRET_REFS: ${SOURCE_SECRET_REFS:-TS_METRICS:demo}
      # The Prometheus below, which the seeder registers as `prometheus-self`
      # (#390), and the Loki of the `logs` profile, `loki-self` (#567). A
      # source URL outside this list must be public https.
      SOURCE_URL_ALLOWLIST: ${SOURCE_URL_ALLOWLIST:-prometheus,loki}
      # Credentials the app resolves for the 'TS_METRICS' source secret_ref.
      TS_METRICS_USERNAME: ${TS_METRICS_USERNAME:-metrics_ro}
      TS_METRICS_PASSWORD: ${TS_METRICS_PASSWORD:-readonly}
      # AI provider (see .env.example / docs).
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_MODEL: ${AI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API: ${OPENAI_API:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-}
      # Keycloak OIDC.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid profile email}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_ACCOUNT_URL: ${OIDC_ACCOUNT_URL:-}
      OIDC_MCP_CLIENT_ID: ${OIDC_MCP_CLIENT_ID:-}
      # Prometheus scrape gate. /api/metrics answers 404 until one is set.
      METRICS_TOKEN: *metrics-token
      METRICS_ALLOWED_CIDRS: ${METRICS_ALLOWED_CIDRS:-}
      # The files demo (#574): DuckDB sources may read what is under here and
      # nothing else. The seeder writes demo/; the app writes uploads/, the
      # CSV files source admins upload from the browser (#595), so its mount
      # is writable. The SQL guard and the locked engine still let a source
      # read only its own files (admin/duckdb.md).
      DUCKDB_SOURCES_DIR: /data/duckdb
    volumes:
      - duckdb-files:/data/duckdb
    ports:
      - "3000:3000"
    # `docker compose stop` sends SIGTERM and waits this long before SIGKILL.
    # Must exceed SHUTDOWN_GRACE_MS (default 10s) or the drain is cut short.
    stop_grace_period: 20s
    # Liveness, the same probe the image's own HEALTHCHECK runs, restated on a
    # shorter cadence so `docker compose up` reaches a healthy app quickly.
    # Readiness (/api/ready) is an orchestrator concern: it fails whenever the
    # database is away, and compose should not call the container unhealthy for
    # that.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    # OIDC URLs use localhost:8080 (browser-facing). Map localhost to the host
    # gateway so server-side JWKS/token fetches inside this container reach the
    # published Keycloak port instead of the container's own loopback.
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  seed:
    image: *migrate-image
    build:
      context: .
      target: migrate
    command: ["node", "node_modules/.bin/tsx", "scripts/seed.ts"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-holotable}:${POSTGRES_PASSWORD:-holotable}@postgres:5432/holotable"
      TIMESCALEDB_URL: "postgresql://${POSTGRES_USER:-holotable}:${POSTGRES_PASSWORD:-holotable}@postgres:5432/holotable"
      TS_METRICS_HOST: postgres
      TS_METRICS_PORT: "5432"
      SEED_INTERVAL_MS: "2000"
      PROMETHEUS_SELF_URL: http://prometheus:9090
      # The `logs` profile's Loki (#567). The seeder registers `loki-self` and
      # the Holotable logs dashboard once it answers, so a stack without the
      # profile has neither.
      LOKI_SELF_URL: ${LOKI_SELF_URL-http://loki:3100}
      # History to write before streaming (#252), e.g. 6h. Empty writes none.
      SEED_BACKFILL: ${SEED_BACKFILL:-}
      # Where the seeder writes the files demo's Parquet and CSV files (#574)
      # and registers the `duckdb-demo` source over them. The only writer.
      DUCKDB_SOURCES_DIR: /data/duckdb
    volumes:
      - duckdb-files:/data/duckdb
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The self-monitoring demo (#54). Scrapes the app's own /api/metrics and
  # lands the samples in metrics.holotable_self, which `seed` registers as the
  # `holotable-self` source — so the shipped demo is Holotable reading guarded
  # SQL over data it produced itself. Prometheus below scrapes the same
  # endpoint, and `seed` registers it as `prometheus-self`, so the second
  # self-monitoring dashboard asks the same questions in PromQL (#390).
  self-metrics:
    image: *migrate-image
    build:
      context: .
      target: migrate
    command: ["node", "node_modules/.bin/tsx", "scripts/self-metrics.ts"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-holotable}:${POSTGRES_PASSWORD:-holotable}@postgres:5432/holotable"
      TIMESCALEDB_URL: "postgresql://${POSTGRES_USER:-holotable}:${POSTGRES_PASSWORD:-holotable}@postgres:5432/holotable"
      METRICS_URL: http://app:3000/api/metrics
      METRICS_TOKEN: *metrics-token
      SELF_METRICS_INTERVAL_MS: ${SELF_METRICS_INTERVAL_MS:-15000}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # End-to-end check, off by default:
  #   docker compose --profile smoke run --rm smoke
  # Waits for the self-monitoring dashboard to answer with real rows through
  # the same guard and executor POST /api/query uses, and fails otherwise.
  smoke:
    profiles: ["smoke"]
    image: *migrate-image
    build:
      context: .
      target: migrate
    command: ["node", "node_modules/.bin/tsx", "scripts/smoke.ts"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-holotable}:${POSTGRES_PASSWORD:-holotable}@postgres:5432/holotable"
      # Resolved for the `TS_METRICS` secret_ref, exactly as the app resolves it
      # — including the grant, which the demo workspace needs as well.
      SOURCE_SECRET_REFS: ${SOURCE_SECRET_REFS:-TS_METRICS:demo}
      TS_METRICS_USERNAME: ${TS_METRICS_USERNAME:-metrics_ro}
      TS_METRICS_PASSWORD: ${TS_METRICS_PASSWORD:-readonly}
      # The Prometheus and Loki sources' endpoints, allowed exactly as the app
      # allows them.
      SOURCE_URL_ALLOWLIST: ${SOURCE_URL_ALLOWLIST:-prometheus,loki}
      # The PromQL self-monitoring dashboard is smoked where the seeder
      # registered it, which is wherever this names a Prometheus (#600).
      PROMETHEUS_SELF_URL: http://prometheus:9090
      # The Holotable logs dashboard is smoked too, so the `logs` profile has
      # to be up (#567). Set LOKI_SELF_URL empty to smoke a stack without it.
      LOKI_SELF_URL: ${LOKI_SELF_URL-http://loki:3100}
      SMOKE_TIMEOUT_MS: ${SMOKE_TIMEOUT_MS:-180000}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      # The files demo (#574), read-only, as the app reads it.
      DUCKDB_SOURCES_DIR: /data/duckdb
    volumes:
      - duckdb-files:/data/duckdb:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Scrapes the app's /api/metrics, and answers the `prometheus-self` source
  # the seeder registers (#390): the PromQL self-monitoring dashboard reads
  # it. Unauthenticated on the compose network; the app reaches it because
  # SOURCE_URL_ALLOWLIST names `prometheus`.
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    depends_on:
      app:
        condition: service_healthy

  # Logs, off by default (#567):
  #   docker compose --profile logs up
  # Alloy tails every container of this compose project through the Docker
  # socket and pushes the lines to Loki, labeled `app` (the compose service),
  # `env` and `container`. The app's own lines are JSON (src/lib/log.ts), which
  # the seeded Holotable logs dashboard parses with `| json`. Loki answers the
  # `loki-self` source, unauthenticated on the compose network; the app
  # reaches it because SOURCE_URL_ALLOWLIST names `loki`. Nothing but Alloy
  # writes to it: Holotable only reads.
  loki:
    profiles: ["logs"]
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100"
    configs:
      - source: loki_config
        target: /etc/loki/loki.yaml

  alloy:
    profiles: ["logs"]
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
    # Read-only: Alloy lists containers and follows their logs, nothing more.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

# Inline so the bearer token comes from the same .env as the app's, instead of
# living in a second checked-in file that would have to hold it in clear text.
configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: holotable
          metrics_path: /api/metrics
          authorization:
            credentials: "${METRICS_TOKEN:-holotable-local-demo-scrape}"
          static_configs:
            - targets: ["app:3000"]

  # A single-binary Loki on its own filesystem, the shape of the image's
  # local config with usage reporting off. No volume: like Prometheus above,
  # it holds a demo's worth of lines and starts empty after a recreate.
  loki_config:
    content: |
      auth_enabled: false
      server:
        http_listen_port: 3100
        log_level: warn
      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      analytics:
        reporting_enabled: false

  # This project's containers only (the e2e stack is a project of its own),
  # labeled by compose service and container name. `env` is constant here; a
  # real deployment sets it per cluster. docs/.../admin/loki.md walks it.
  alloy_config:
    content: |
      discovery.docker "compose" {
        host = "unix:///var/run/docker.sock"
        filter {
          name   = "label"
          values = ["com.docker.compose.project=${COMPOSE_PROJECT_NAME}"]
        }
      }

      discovery.relabel "compose" {
        targets = []

        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/(.*)"
          target_label  = "container"
        }
        rule {
          target_label = "env"
          replacement  = "dev"
        }
      }

      loki.source.docker "compose" {
        host          = "unix:///var/run/docker.sock"
        targets       = discovery.docker.compose.targets
        relabel_rules = discovery.relabel.compose.rules
        forward_to    = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

volumes:
  pgdata:
  # The files demo's Parquet and CSV files (#574), written by `seed`.
  duckdb-files:
